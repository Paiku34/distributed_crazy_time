<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distributed Crazy Time — Live Game Show</title>
    <meta name="description"
        content="Distributed Crazy Time: a real-time multiplayer game show powered by Erlang and Spring Boot.">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Sfondo animato -->
    <div class="background-animation"></div>
    <div class="bg-particles" id="bg-particles"></div>

    <!-- Container Login/Registrazione -->
    <div id="auth-screen" class="glass-panel auth-panel">
        <div class="auth-logo">
            <span class="logo-crazy">CRAZY</span>
            <span class="logo-time">TIME</span>
        </div>
        <p class="auth-subtitle">Distributed Game Show</p>

        <div class="auth-tabs">
            <button id="tab-login" class="active">Login</button>
            <button id="tab-register">Register</button>
        </div>

        <form id="auth-form" autocomplete="off">
            <div class="input-group">
                <input type="text" id="username" placeholder=" " required>
                <label for="username">Username</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder=" " required minlength="4">
                <label for="password">Password</label>
            </div>

            <div id="register-fields" style="display: none;">
                <div class="input-group">
                    <input type="number" id="initial-balance" value="1000" min="0" max="1000" placeholder=" ">
                    <label for="initial-balance">Saldo iniziale (Max $1000)</label>
                </div>
            </div>

            <button type="submit" id="auth-btn" class="glow-btn">
                <span id="auth-btn-text">Entra nel Gioco</span>
                <div id="auth-spinner" class="spinner" style="display:none;"></div>
            </button>
        </form>
        <p id="auth-error" class="error-msg"></p>
    </div>

    <!-- ====== GAME SCREEN ====== -->
    <div id="game-screen" style="display: none; width: 100vw; height: 100vh; overflow: hidden; position: relative;">

        <!-- Bottom Left Logo & Balance (Moved to game-screen level for absolute bottom left positioning) -->
        <div class="hud-bottom-left" style="position: absolute; bottom: 20px; left: 20px; z-index: 50;">
            <img src="img/crazy_time_logo.png" alt="Crazy Time"
                style="max-height: 170px; margin-bottom: 10px; display: block;">
            <div class="user-stats"
                style="background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); display: flex; flex-direction: column; gap: 5px;">
                <span style="color: #ccc; font-size: 0.9rem;">Saldo: <strong id="player-balance"
                        style="color: #10b981; font-size: 1.2rem;">$0.00</strong></span>
                <span style="color: #ccc; font-size: 0.9rem;">Totale Scommessa: <strong id="total-bet-display"
                        style="color: #fbbf24; font-size: 1.2rem;">$0.00</strong></span>
            </div>
        </div>

        <!-- Bottom Right History (Moved to game-screen level for absolute bottom right positioning) -->
        <div id="last-results" class="history-grid"
            style="position: absolute; bottom: 20px; right: 20px; display: grid; grid-template-columns: repeat(7, 40px); grid-template-rows: repeat(3, 40px); gap: 5px; z-index: 50; direction: ltr;">
            <!-- History items will be injected here -->
        </div>

        <!-- Main Game Area -->
        <main class="game-main"
            style="width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center;">

            <!-- Wheel Area (Top 2/3) -->
            <div class="wheel-section"
                style="width: 100%; flex: 0 0 65%; display: flex; align-items: center; justify-content: center; position: relative; padding-top: 2vh;">


                <!-- Wheel -->
                <div class="wheel-container">
                    <div class="wheel-pointer-container">
                        <div class="wheel-pointer">▼</div>
                    </div>
                    <canvas id="wheel-canvas" width="500" height="500"></canvas>
                    <div class="wheel-center-overlay" style="display: none;">
                        <span id="wheel-center-text">CRAZY<br>TIME</span>
                    </div>
                </div>


            </div>

            <!-- Betting Area (Bottom 1/3) -->
            <div class="betting-section"
                style="width: 100%; flex: 0 0 35%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 2vh; position: relative;">

                <!-- Phase overlay text -->
                <div id="phase-text-overlay"
                    style="position: absolute; top: -30px; font-size: 1.5rem; font-weight: bold; color: #fbbf24; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 4px black; z-index: 20; pointer-events: none;">
                </div>

                <!-- Bets Background with Hitboxes -->
                <div class="bets-area-container"
                    style="position: relative; width: 90vw; max-width: 350px; aspect-ratio: 4/1; top:-40px;">
                    <img src="img/bets.png"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; z-index: 1;">

                    <!-- HITBOXES: adjust top, left, width, height if needed -->
                    <div class="bet-hitbox" data-segment="1"
                        style="z-index: 5; top: 10%; left: 5%; width: 20%; height: 40%;"></div>
                    <div class="bet-hitbox" data-segment="2"
                        style="z-index: 5; top: 10%; left: 28%; width: 20%; height: 40%;"></div>
                    <div class="bet-hitbox" data-segment="CoinFlip"
                        style="z-index: 5; top: 10%; left: 52%; width: 20%; height: 40%;"></div>
                    <div class="bet-hitbox" data-segment="Pachinko"
                        style="z-index: 5; top: 10%; left: 75%; width: 20%; height: 40%;"></div>

                    <div class="bet-hitbox" data-segment="5"
                        style="z-index: 5; top: 55%; left: 5%; width: 20%; height: 40%;"></div>
                    <div class="bet-hitbox" data-segment="10"
                        style="z-index: 5; top: 55%; left: 28%; width: 20%; height: 40%;"></div>
                    <div class="bet-hitbox" data-segment="CashHunt"
                        style="z-index: 5; top: 55%; left: 52%; width: 20%; height: 40%;"></div>
                    <div class="bet-hitbox" data-segment="CrazyTime"
                        style="z-index: 5; top: 55%; left: 75%; width: 20%; height: 40%;"></div>

                </div>

                <!-- Chips Background with Hitboxes -->
                <div class="chips-area-container"
                    style="position: relative; width: 90vw; max-width: 500px; aspect-ratio: 6/1; top: -40px;">
                    <img src="img/fish.png"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: auto; display: block; z-index: 1;">

                    <!-- Undo Button -->
                    <div id="btn-undo"
                        style="position: absolute; z-index: 5; top: 0px; left: 8%; width: 8%; height: 50%; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; color: white; font-weight: bold; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);">
                        UNDO
                    </div>

                    <div class="chip-hitbox active-chip" data-amount="0.10"
                        style="z-index: 5; top: 0px; left: 17%; width: 8%; height: 50%;"></div>
                    <div class="chip-hitbox" data-amount="0.20"
                        style="z-index: 5; top: 0px; left: 26%; width: 8%; height: 50%;"></div>
                    <div class="chip-hitbox" data-amount="0.50"
                        style="z-index: 5; top: 0px; left: 35%; width: 8%; height: 50%;"></div>
                    <div class="chip-hitbox" data-amount="1"
                        style="z-index: 5; top: 0px; left: 44%; width: 8%; height: 50%;"></div>
                    <div class="chip-hitbox" data-amount="2"
                        style="z-index: 5; top: 0px; left: 53%; width: 8%; height: 50%;"></div>
                    <div class="chip-hitbox" data-amount="5"
                        style="z-index: 5; top: 0px; left: 62%; width: 8%; height: 50%;"></div>
                    <div class="chip-hitbox" data-amount="25"
                        style="z-index: 5; top: 0px; left: 71%; width: 8%; height: 50%;"></div>

                    <!-- 2x Button -->
                    <div id="btn-2x"
                        style="position: absolute; z-index: 5; top: 0px; left: 80%; width: 8%; height: 50%; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(16, 185, 129, 0.2); border: 2px solid #10b981; color: white; font-weight: bold; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 10px rgba(16, 185, 129, 0.3);">
                        2X
                    </div>

                </div>
            </div>
        </main>

        <!-- Dev Tools (Forcing Outcomes) -->
        <div class="dev-panel glass-panel"
            style="position:fixed; top:20px; right:20px; padding:10px; z-index:9999; display:flex; gap:5px; align-items:center; flex-direction:column; background:rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.2);">
            <div style="color:#aaa; font-size:12px; margin-bottom:5px; font-weight:bold;">FORZA PROSSIMO GIRO (DEV)
            </div>
            <div style="display:flex; gap:5px; flex-wrap:wrap; max-width:220px; justify-content:center;">
                <button onclick="forceResult('Pachinko')"
                    style="background:#8b5cf6; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Pachinko</button>
                <button onclick="forceResult('CoinFlip')"
                    style="background:#3b82f6; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">CoinFlip</button>
                <button onclick="forceResult('CashHunt')"
                    style="background:#10b981; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">CashHunt</button>
                <button onclick="forceResult('CrazyTime')"
                    style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">CrazyTime</button>
                <button onclick="forceResult('10')"
                    style="background:#555; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Num
                    10</button>
            </div>
        </div>

        <!-- Minigame Overlay -->
        <div id="minigame-overlay" class="fullscreen-overlay" style="display: none;">
            <div class="minigame-container glass-panel">
                <h2 id="minigame-title" class="minigame-title">MINIGIOCO</h2>
                <div id="minigame-animation-area" class="minigame-area">
                    <!-- Animazioni iniettate da JS -->
                </div>
            </div>
        </div>



    </div>

    <!-- SockJS e STOMP da CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <!-- Script App -->
    <script src="app.js?v=24"></script>
</body>

</html>
